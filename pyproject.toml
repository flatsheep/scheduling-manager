[tool.coverage.run]
branch = true
timid = true
source = ["custom_components.scheduling_manager"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 95.1
precision = 2

[tool.ruff]
target-version = "py313"
line-length = 120
include = ["custom_components/**/*.py", "tests/**/*.py", "tools/*.py"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
files = ["custom_components/scheduling_manager"]
follow_imports = "silent"
ignore_missing_imports = true
