# Engineering checklist only: custom integrations do not acquire an official tier.
rules:
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Local calendar timers and HA events; Away, Disabled controls and activity sensors are push-updated without polling.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-triggers:
    status: exempt
    comment: No integration-specific automation triggers are provided.
  docs-conditions:
    status: exempt
    comment: No integration-specific automation conditions are provided.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Local helper with no external connection, credentials or user connection parameters.
  test-before-setup: done
  unique-config-entry: done
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: todo
  log-when-unavailable:
    status: exempt
    comment: Device connectivity is owned by the target integrations; pending errors are exposed through the manager API without repeat enforcement logs.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Uses HA's authenticated session; no separate account or credentials exist.
  test-coverage:
    status: todo
    comment: Latest isolated HA 2026.8.1 result is 96.29% combined line/branch coverage, above the 95.1% CI gate. This checklist does not claim an official quality tier.
  diagnostics: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  repair-issues: done
  devices: done
  discovery:
    status: exempt
    comment: No external device or service is discovered by this helper.
  discovery-update-info:
    status: exempt
    comment: No external network endpoint is stored.
  dynamic-devices: done
  stale-devices: done
  reconfiguration-flow:
    status: exempt
    comment: The config entry has no connection parameters; validated schedules use the card and enabled/disabled flags also have programmatic controls.
  entity-category:
    status: exempt
    comment: Away and Disabled switches are normal user-facing controls, not diagnostic or setup-only entities.
  entity-device-class:
    status: exempt
    comment: No switch device class represents an Away scheduling mode.
  entity-disabled-by-default:
    status: exempt
    comment: Away, schedule/band Disabled switches and schedule activity sensors are user-facing entities enabled by default.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  async-dependency:
    status: exempt
    comment: No external client library; all dispatch uses HA's asynchronous APIs.
  inject-websession:
    status: exempt
    comment: No outbound HTTP client is used.
  strict-typing: todo
